<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D1C" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DevHub Africa — aider, construire, prouver</title>
    <meta name="description" content="La plateforme des développeurs basée sur la preuve. Débloque-toi avec l'IA puis un pair qui a déjà résolu ton problème, construis à plusieurs, et prouve ce que tu sais faire. Même hors ligne." />
    <meta property="og:title" content="DevHub Africa — aider, construire, prouver" />
    <meta property="og:description" content="La plateforme des développeurs basée sur la preuve. Hors ligne d'abord, hébergée chez Systalink." />
    <meta property="og:type" content="website" />
    <script>
      // Applique le thème avant le premier rendu (évite le flash). Préférence locale, sinon système.
      try {
        var t = localStorage.getItem('dh-theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
