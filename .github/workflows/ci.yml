# CI/CD DevHub Africa — voir docs/architecture/11-infrastructure-deploiement.md
#
# Sur chaque PR : qualité, tests, build. Sur main : en plus, images Docker et déploiement.
# Le déploiement ne s'active que si la variable de dépôt DEPLOY_ENABLED vaut "true"
# (à positionner par le rôle DevOps une fois le VPS et les secrets prêts).

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devhub
          POSTGRES_PASSWORD: devhub
          POSTGRES_DB: devhub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devhub"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://devhub:devhub@localhost:5432/devhub_test
      AUTH_FAKE_PROVIDER: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrations sur la base de test
        run: pnpm --filter @devhub/api exec prisma migrate deploy
      - run: pnpm test
      - run: pnpm build
      # Budget de l'accueil (03-frontend.md). En mode rapport tant que BUG-024 est ouvert :
      # retirer continue-on-error dès que l'accueil repasse sous le budget.
      - name: Budget de performance de l'accueil
        continue-on-error: true
        run: node apps/web/scripts/check-budget.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e (Playwright, parcours SOS + hors ligne)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devhub
          POSTGRES_PASSWORD: devhub
          POSTGRES_DB: devhub_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devhub"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://devhub:devhub@localhost:5432/devhub_e2e
      AUTH_FAKE_PROVIDER: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @devhub/web exec playwright install --with-deps chromium
      # Construit l'API et le web, applique migrations et étiquettes, puis lance apps/web/e2e
      # (playwright.config.ts) : parcours SOS, hors ligne et connexion.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results

  security:
    name: secrets + dépendances
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lit la liste des commits de la PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  images:
    name: images Docker
    runs-on: ubuntu-latest
    needs: [quality, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # ghcr.io refuse les majuscules (« CADEV-saiyens ») : même nom que infra/docker-compose.yml.
      - name: Nom des images en minuscules
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.api
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.web
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: déploiement Systalink
    runs-on: ubuntu-latest
    needs: images
    # Secrets du dépôt (infra/README.md) : VPS_HOST, VPS_SSH_KEY, VPS_KNOWN_HOSTS.
    permissions:
      contents: read
      packages: read # le GITHUB_TOKEN du job sert au serveur à tirer les images, puis expire
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Déployer via SSH
        # Sur le serveur, la clé de la CI n'accepte que « deploy <sha> <acteur> » (devhub-deploy-gate) ;
        # l'empreinte du serveur est vérifiée (VPS_KNOWN_HOSTS) et le jeton passe par l'entrée standard.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "deploy@$VPS_HOST" "deploy $GITHUB_SHA $GITHUB_ACTOR"
