# Applications mobiles (apps/mobile, ADR-0021). Ne tourne que si le mobile, ou le contrat
# d'authentification qu'il utilise, change. La tâche iOS demande un exécuteur macOS.

name: Mobile

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/contracts/src/auth.ts'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/mobile

jobs:
  android:
    name: Android (tests, lint, APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:testAndroidHostTest :androidApp:lintDebug :androidApp:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            apps/mobile/shared/build/reports/tests/
            apps/mobile/androidApp/build/reports/lint-results-debug.html
          retention-days: 7

  ios:
    name: iOS (tests Kotlin, build simulateur)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:iosSimulatorArm64Test --console=plain
      - run: brew install xcodegen
      - name: Build de l'application (simulateur, sans signature)
        working-directory: apps/mobile/iosApp
        run: |
          xcodegen
          xcodebuild -project DevHub.xcodeproj -scheme DevHub \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Archive de l'application pour un simulateur en ligne
        working-directory: apps/mobile/iosApp/build/Build/Products/Debug-iphonesimulator
        run: ditto -c -k --keepParent DevHub.app "$GITHUB_WORKSPACE/DevHub-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: DevHub-simulator.zip
          retention-days: 7
