# Configuration gitleaks (CI « secrets + dépendances » et pré-vol) : règles par défaut, plus des exceptions.
[extend]
useDefault = true

[allowlist]
description = "Faux secrets volontaires : tests du masquage, exemple de documentation"
paths = [
  '''^packages/core/src/secrets/mask\.spec\.ts$''',
]
