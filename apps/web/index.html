<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F8FA" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DevHub Africa — la plateforme d’échange des devs africains</title>
    <meta
      name="description"
      content="La plateforme d'échange des développeurs africains, par les devs, pour les devs : entraide, actu tech, projets, emplois, certifications vérifiables, pré-vol et banc d'essai. Même hors ligne."
    />
    <meta
      property="og:title"
      content="DevHub Africa — la plateforme d’échange des devs africains"
    />
    <meta
      property="og:description"
      content="Par les devs, pour les devs : entraide, actu, projets, emplois et preuves de compétences. Hébergée en Afrique chez Systalink."
    />
    <meta property="og:type" content="website" />
    <script>
      // Applique le thème avant le premier rendu (évite le flash). Préférence locale, sinon système.
      try {
        // Clair par défaut (charte « Drivery ») ; le sombre reste un choix explicite.
        var t = localStorage.getItem('dh-theme2');
        if (t !== 'light' && t !== 'dark') t = 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
