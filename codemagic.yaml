# Codemagic : build de l'application iOS pour le simulateur, affichée dans « App Preview ».
# Lancé à la main depuis l'interface (aucun déclencheur automatique).
workflows:
  ios-simulator:
    name: iOS simulateur
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 21
      xcode: latest
    scripts:
      - name: Générer le projet Xcode
        script: brew install xcodegen && cd apps/mobile/iosApp && xcodegen
      - name: Compiler pour le simulateur
        script: |
          cd apps/mobile/iosApp
          xcodebuild -project DevHub.xcodeproj -scheme DevHub \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - apps/mobile/iosApp/build/Build/Products/Debug-iphonesimulator/DevHub.app
