# Production sur le serveur devhub-app (VPS Systalink) — voir infra/README.md.
# La base PostgreSQL tourne sur l'autre VPS (devhub-data), jointe par le réseau privé en TLS vérifié :
# DATABASE_URL=...@10.10.3.62:5432/devhub?sslmode=verify-full&sslrootcert=/srv/devhub/pg-ca.crt
# Les images sont construites par la CI et étiquetées avec le SHA du commit (variable TAG).
# Lancement : TAG=<sha> docker compose -f infra/docker-compose.yml --env-file /srv/devhub/.env up -d

x-app: &app
  image: ghcr.io/sx1vio/cadev-saiyens/api:${TAG:?TAG manquant}
  env_file: /srv/devhub/.env
  restart: unless-stopped
  networks: [internal]
  # Autorité TLS privée de la base (devhub-data) : vérifie le certificat du serveur PostgreSQL.
  volumes:
    - /srv/devhub/pg-ca.crt:/srv/devhub/pg-ca.crt:ro
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '5' }

services:
  caddy:
    image: ghcr.io/sx1vio/cadev-saiyens/web:${TAG:?TAG manquant} # Caddy + build du front
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?domaine public manquant}
      # Adresse de l'administration (ex. admin.devhub.africa) ; à reporter dans ADMIN_URL côté API.
      ADMIN_ADDRESS: ${ADMIN_ADDRESS:-http://127.0.0.1:8081}
      # Portail entreprise (ex. business.devhub.africa) ; à reporter dans BUSINESS_URL côté API.
      BUSINESS_ADDRESS: ${BUSINESS_ADDRESS:-http://127.0.0.1:8082}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    networks: [internal]

  api:
    <<: *app
    environment:
      PROCESS_ROLE: http
      # Version déployée, affichée dans la supervision de l'administration.
      APP_RELEASE: ${TAG}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/readyz']
      interval: 10s
      timeout: 3s
      retries: 6

  worker:
    <<: *app
    command: ['node', 'dist/worker.js']
    environment:
      PROCESS_ROLE: worker
      APP_RELEASE: ${TAG}
    # Y1 : status.check lit le fichier d'état écrit par backup.sh (BACKUP_STATUS_URL).
    volumes:
      - /srv/devhub/pg-ca.crt:/srv/devhub/pg-ca.crt:ro
      - /srv/devhub/backups:/srv/devhub/backups:ro

  # Pas de service postgres ici : la base est sur devhub-data (infra/scripts/serveurs/role-data.sh).

volumes:
  caddy_data:
  caddy_config:

networks:
  internal:
