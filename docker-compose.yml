# Déploiement DevHub Africa sur un VPS Systalink : PostgreSQL + API + Caddy (HTTPS automatique, front statique).
# Prérequis : `cd frontend && npm run build` (le dossier frontend/dist est servi par Caddy), un fichier backend/.env.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: devhub
      POSTGRES_USER: devhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://devhub:${POSTGRES_PASSWORD}@db:5432/devhub
      DATA_DIR: /data/pg
    volumes:
      - apidata:/data
    depends_on: [db]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro
      - caddydata:/data
    depends_on: [api]

volumes:
  pgdata:
  apidata:
  caddydata:
